name: E2E smoke tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test (leave empty to build and test this branch locally). Example: https://sub-project.fin-route.site'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run tests
        env:
          # Empty = build this branch and test it locally (public tests only).
          E2E_BASE_URL: ${{ github.event.inputs.base_url }}
          # Signed-in tests run only when these repository secrets exist,
          # and must point at a DEDICATED TEST TENANT, never a real business.
          E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
          E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
